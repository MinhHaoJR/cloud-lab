services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mhaojr/mern-backend:2.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI:?Set MONGODB_URI in .env}
      - PORT=5000
      - CLIENT_URL=http://localhost:5173

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: mhaojr/mern-frontend:3.0
    container_name: mern-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - BACKEND_URL=http://backend:5000
