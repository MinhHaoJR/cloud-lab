services:
  backend:
    image: mhaojr/mern-backend:2.0
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      PORT: "5000"
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173

  frontend:
    image: mhaojr/mern-frontend:3.0
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      PORT: "5173"
      BACKEND_URL: http://backend:5000
